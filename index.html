<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1020">
  <title>证书已申请下来，即将回归</title>
  <style>
    :root{
      --bg:#080b14;
      --card:rgba(18,23,38,.72);
      --text:#f7f8fc;
      --muted:#a9b0c2;
      --line:rgba(255,255,255,.09);
      --accent:#c9b6ff;
      --accent2:#8ec5ff;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 8%, rgba(125,102,255,.18), transparent 30%),
        radial-gradient(circle at 10% 70%, rgba(77,154,255,.08), transparent 28%),
        var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      overflow-x:hidden;
    }
    body:before{
      content:"";
      position:fixed; inset:0; pointer-events:none; opacity:.32;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:52px 52px;
      mask-image:linear-gradient(to bottom,#000,transparent 78%);
    }
    .wrap{width:min(920px,calc(100% - 36px));margin:auto}
    .hero{
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:72px 0 56px;
      position:relative;
    }
    .hero-inner{text-align:center;max-width:780px}
    .eyebrow{
      display:inline-flex;align-items:center;gap:9px;
      padding:8px 14px;border:1px solid var(--line);
      border-radius:999px;background:rgba(255,255,255,.035);
      color:#cbd1df;font-size:13px;letter-spacing:.12em;
      animation:rise .8s ease both;
    }
    .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}
    h1{
      margin:30px 0 18px;
      font-size:clamp(44px,8vw,82px);
      line-height:1.04;letter-spacing:-.055em;
      font-weight:700;
      background:linear-gradient(135deg,#fff 18%,#ddd9ff 58%,#a9cbff);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      animation:rise .9s .08s ease both;
    }
    .lead{
      margin:0 auto;color:var(--muted);
      font-size:clamp(17px,2.4vw,21px);line-height:1.9;
      max-width:650px;animation:rise .9s .16s ease both;
    }
    .scroll{
      display:inline-flex;margin-top:52px;color:#7f8799;font-size:12px;
      letter-spacing:.18em;text-decoration:none;
      animation:float 2.4s ease-in-out infinite,fade .9s .5s both;
    }
    .letter-section{padding:20px 0 90px}
    .letter{
      position:relative;
      padding:clamp(30px,6vw,68px);
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
      box-shadow:0 30px 100px rgba(0,0,0,.32);
      backdrop-filter:blur(18px);
      overflow:hidden;
    }
    .letter:before{
      content:"";
      position:absolute;width:260px;height:260px;right:-110px;top:-120px;
      border-radius:50%;
      background:rgba(170,145,255,.11);filter:blur(10px)
    }
    .letter-top{
      display:flex;justify-content:space-between;gap:20px;
      align-items:center;margin-bottom:42px;
      color:#81899d;font-size:12px;letter-spacing:.14em;
    }
    .rule{height:1px;background:var(--line);flex:1}
    .letter h2{font-size:clamp(28px,4vw,42px);margin:0 0 38px;letter-spacing:-.03em}
    .letter p{
      color:#c1c6d3;font-size:16px;line-height:2.15;margin:0 0 24px;
    }
    .letter .strong{
      color:#fff;font-weight:600;
      font-size:18px;line-height:1.9;
      margin:34px 0;
    }
    .thanks{
      margin:52px 0 10px;
      padding:30px 0;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      text-align:center;
    }
    .thanks .big{
      font-size:clamp(25px,4vw,40px);font-weight:650;
      letter-spacing:-.035em;margin-bottom:12px;
    }
    .thanks .small{color:#858da0;font-size:14px}
    .signature{text-align:right;color:#9da5b7;line-height:1.9;margin-top:38px}
    .signature b{color:#e6e8ef;font-weight:500}
    footer{
      text-align:center;padding:20px 0 70px;color:#535b6d;font-size:12px;letter-spacing:.06em
    }
    .top{
      position:fixed;right:22px;bottom:22px;width:42px;height:42px;
      border:1px solid var(--line);border-radius:50%;
      background:rgba(13,17,29,.75);color:#aeb5c4;cursor:pointer;
      backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:.25s
    }
    .top.show{opacity:1;pointer-events:auto}
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
    @media(max-width:600px){
      .wrap{width:min(100% - 24px,920px)}
      .hero{min-height:92vh;padding:45px 0}
      .letter{border-radius:20px;padding:28px 22px}
      .letter-top{margin-bottom:30px}
      .letter p{font-size:15px;line-height:2}
      .letter .strong{font-size:17px}
      .scroll{margin-top:38px}
    }
  </style>
</head>
<body>

  <main>
    <section class="hero">
      <div class="wrap hero-inner">
        <div class="eyebrow"><span class="dot"></span> 这一段旅程 · 到这里就好</div>
        <h1>感谢相遇<br>有缘再见</h1>
        <p class="lead">
          一个网站的故事即将落幕。<br>
          感谢你曾经来过，也感谢你陪它走过这一程。
        </p>
        <a class="scroll" href="#letter">SCROLL TO READ ↓</a>
      </div>
    </section>

    <section class="letter-section" id="letter">
      <div class="wrap">
        <article class="letter">
          <div class="letter-top">
            <span>最后一封信</span>
            <span class="rule"></span>
            <span>2026</span>
          </div>

          <h2>致一直支持我们的用户：</h2>

          </p>

          <div class="thanks">
            <div class="big">感谢相遇 · 感谢信任 · 感谢一路以来的支持</div>
            <div class="small">。</div>
          </div>

          <p style="text-align:center;margin-top:42px">
            
          </p>

          <div class="signature">
            相关证书已申请 即将回归
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer>敬请期待。</footer>

  <button class="top" id="top" aria-label="返回顶部">↑</button>

  <script>
    const topBtn = document.getElementById('top');
    window.addEventListener('scroll', () => {
      topBtn.classList.toggle('show', window.scrollY > 500);
    });
    topBtn.addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));
  </script>
</body>
</html>
